<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Sign up — InfluTree</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',system-ui,sans-serif;background:#F0F9FF;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}
.card{background:#fff;border-radius:20px;padding:48px 40px;width:100%;max-width:420px;box-shadow:0 8px 32px rgba(14,165,233,.12),0 2px 8px rgba(0,0,0,.06);border:1px solid #E0F2FE;}
.logo-row{display:flex;align-items:center;gap:10px;margin-bottom:28px;justify-content:center;}
.logo-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#0EA5E9,#2563EB);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(14,165,233,.4);}
.logo-text{font-size:20px;font-weight:800;color:#0F172A;}
h1{font-size:26px;font-weight:800;text-align:center;margin-bottom:6px;color:#0F172A;}
.sub{font-size:14px;color:#64748B;text-align:center;margin-bottom:28px;}
.form{display:flex;flex-direction:column;gap:16px;}
.field{display:flex;flex-direction:column;gap:6px;}
label{font-size:13px;font-weight:600;color:#334155;}
input{padding:11px 14px;border:1.5px solid #E2E8F0;border-radius:10px;font-size:15px;color:#0F172A;background:#F8FAFC;outline:none;font-family:inherit;transition:border-color .15s;}
input:focus{border-color:#0EA5E9;}
.error{background:#FEF2F2;color:#DC2626;padding:10px 14px;border-radius:9px;font-size:13px;border:1px solid #FECACA;display:none;}
.error.show{display:block;}
.btn{padding:13px;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(135deg,#0EA5E9,#2563EB);border:none;border-radius:11px;box-shadow:0 4px 14px rgba(2,132,199,.4);margin-top:4px;cursor:pointer;font-family:inherit;transition:all .2s;}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(2,132,199,.45);}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}
.switch{text-align:center;font-size:14px;color:#64748B;margin-top:20px;}
.switch a{color:#0284C7;font-weight:600;}
/* Done state */
.done{text-align:center;display:none;}
.done.show{display:block;}
.done-icon{font-size:48px;margin-bottom:16px;}
.done h2{font-size:22px;font-weight:800;margin-bottom:10px;color:#0F172A;}
.done p{font-size:14px;color:#64748B;line-height:1.7;margin-bottom:20px;}
.done a{color:#0284C7;font-weight:600;font-size:14px;}
</style>
</head>
<body>
<div class="card">
  <div class="logo-row">
    <div class="logo-icon">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <circle cx="10" cy="8" r="2" fill="white"/>
        <path d="M6 6 Q3 8 6 10" stroke="white" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <path d="M14 6 Q17 8 14 10" stroke="white" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <path d="M4 4 Q0 8 4 12" stroke="white" stroke-width="1.3" stroke-linecap="round" fill="none" opacity=".6"/>
        <path d="M16 4 Q20 8 16 12" stroke="white" stroke-width="1.3" stroke-linecap="round" fill="none" opacity=".6"/>
        <line x1="10" y1="10" x2="10" y2="16" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M7.5 16 Q10 14.5 12.5 16" stroke="white" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      </svg>
    </div>
    <span class="logo-text">InfluTree</span>
  </div>

  <!-- Form -->
  <div id="form-wrap">
    <h1>Create your account</h1>
    <p class="sub">Start discovering influencers for free</p>
    <div class="form">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com" required/>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="Min. 6 characters" minlength="6" required/>
      </div>
      <div class="error" id="err"></div>
      <button class="btn" id="btn" onclick="handleRegister()">Create Account</button>
    </div>
    <p class="switch">Already have an account? <a href="login.html">Log in</a></p>
  </div>

  <!-- Done -->
  <div class="done" id="done">
    <div class="done-icon">📬</div>
    <h2>Check your email</h2>
    <p>We sent a confirmation link to <strong id="done-email"></strong>.<br/>Click the link to activate your account.</p>
    <a href="login.html">← Back to login</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const { createClient } = supabase
const sb = createClient(
  'https://fxzffwqhzybrrsgiajyc.supabase.co',
  'sb_publishable_NiFVL8pxuUhwEDUsym1TDA_NPFmqqED'
)

sb.auth.getSession().then(({ data }) => {
  if (data.session) location.href = 'dashboard.html'
})

async function handleRegister() {
  const email = document.getElementById('email').value
  const password = document.getElementById('password').value
  const btn = document.getElementById('btn')
  const err = document.getElementById('err')
  btn.disabled = true
  btn.textContent = 'Creating account…'
  err.classList.remove('show')

  const { error } = await sb.auth.signUp({
    email, password,
    options: { emailRedirectTo: location.origin + '/dashboard.html' }
  })

  if (error) {
    err.textContent = error.message
    err.classList.add('show')
    btn.disabled = false
    btn.textContent = 'Create Account'
  } else {
    document.getElementById('form-wrap').style.display = 'none'
    document.getElementById('done-email').textContent = email
    document.getElementById('done').classList.add('show')
  }
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') handleRegister() })
</script>
</body>
</html>
